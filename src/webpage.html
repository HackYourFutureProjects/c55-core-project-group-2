<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Simple Task Manager</title>
    <style>
      :root {
        --bg: #0b1220;
        --card: #0f1724;
        --muted: #9aa4b2;
        --accent: #22c0a8;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: Inter, system-ui, Arial;
        background: linear-gradient(180deg, #07101a, #0b1220);
        color: #e6eef6;
      }
      .wrap {
        max-width: 640px;
        margin: 40px auto;
        padding: 20px;
      }
      .card {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          rgba(255, 255, 255, 0.01)
        );
        padding: 14px;
        border-radius: 10px;
        box-shadow: 0 6px 18px rgba(2, 6, 23, 0.6);
      }
      h1 {
        margin: 0 0 10px 0;
        font-size: 20px;
      }
      .input-row {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      input[type='text'] {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.04);
        background: transparent;
        color: inherit;
        outline: none;
      }
      button {
        background: linear-gradient(90deg, var(--accent), #6ea8ff);
        border: 0;
        padding: 10px 12px;
        border-radius: 8px;
        color: #07141b;
        font-weight: 600;
        cursor: pointer;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      .lists {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 12px;
      }
      .list {
        padding: 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.01);
      }
      .list h3 {
        margin: 0 0 8px 0;
        font-size: 14px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .task {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.02);
      }
      .task .left {
        display: flex;
        gap: 10px;
        align-items: center;
        flex: 1;
      }
      .task .title {
        word-break: break-word;
      }
      .task button {
        background: transparent;
        border: 0;
        color: var(--muted);
        cursor: pointer;
        padding: 6px;
        border-radius: 6px;
      }
      .small {
        font-size: 13px;
        color: var(--muted);
      }
      @media (max-width: 640px) {
        .lists {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card" role="application" aria-label="Simple task manager">
        <h1>Simple Task Manager</h1>
        <div class="muted">
          Add tasks quickly — data saved locally in your browser.
        </div>

        <div style="height: 12px"></div>

        <div class="input-row" aria-hidden="false">
          <input
            id="taskInput"
            type="text"
            placeholder="Enter a task and press Add or Enter"
            autofocus
          />
          <button id="addBtn">Add</button>
        </div>

        <div class="lists" aria-live="polite">
          <div class="list" aria-label="Open tasks">
            <h3>Open</h3>
            <ul id="openList"></ul>
            <div id="openEmpty" class="small muted">No open tasks</div>
          </div>

          <div class="list" aria-label="Completed tasks">
            <h3>Completed</h3>
            <ul id="completedList"></ul>
            <div id="doneEmpty" class="small muted">No completed tasks</div>
          </div>
        </div>

        <div
          style="
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            align-items: center;
          "
        >
          <div class="small muted" id="counts"></div>
          <div>
            <button id="clearDone">Clear completed</button>
            <button
              id="resetAll"
              style="
                margin-left: 8px;
                background: transparent;
                border: 1px solid rgba(255, 255, 255, 0.04);
                color: var(--muted);
              "
            >
              Reset
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const input = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const openList = document.getElementById('openList');
        const completedList = document.getElementById('completedList');
        const openEmpty = document.getElementById('openEmpty');
        const doneEmpty = document.getElementById('doneEmpty');
        const counts = document.getElementById('counts');
        const clearDone = document.getElementById('clearDone');
        const resetAll = document.getElementById('resetAll');

        let tasks = { open: [], done: [] };
        const STORAGE_KEY = 'simple_tasks_v1';

        function save() {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          update();
        }
        function load() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) tasks = JSON.parse(raw);
          } catch (e) {
            tasks = { open: [], done: [] };
          }
          update();
        }

        function makeItem(task, done = false) {
          const li = document.createElement('li');
          li.className = 'task';
          const left = document.createElement('div');
          left.className = 'left';
          const title = document.createElement('div');
          title.className = 'title';
          title.textContent = task.text;
          left.appendChild(title);

          const right = document.createElement('div');
          if (!done) {
            const doneBtn = document.createElement('button');
            doneBtn.title = 'Mark complete';
            doneBtn.innerHTML = '✔';
            doneBtn.addEventListener('click', () => {
              markDone(task.id);
            });
            right.appendChild(doneBtn);
          } else {
            const reopenBtn = document.createElement('button');
            reopenBtn.title = 'Reopen task';
            reopenBtn.innerHTML = '⟲';
            reopenBtn.addEventListener('click', () => {
              reopen(task.id);
            });
            right.appendChild(reopenBtn);
          }
          const delBtn = document.createElement('button');
          delBtn.title = 'Delete';
          delBtn.innerHTML = '✖';
          delBtn.addEventListener('click', () => {
            remove(task.id, done);
          });
          right.appendChild(delBtn);

          li.appendChild(left);
          li.appendChild(right);
          return li;
        }

        function render() {
          openList.innerHTML = '';
          completedList.innerHTML = '';
          tasks.open.forEach((t) => openList.appendChild(makeItem(t, false)));
          tasks.done.forEach((t) =>
            completedList.appendChild(makeItem(t, true))
          );
          openEmpty.style.display = tasks.open.length ? 'none' : 'block';
          doneEmpty.style.display = tasks.done.length ? 'none' : 'block';
          counts.textContent = `${tasks.open.length} open · ${tasks.done.length} completed`;
        }

        function addTask(text) {
          const trimmed = (text || '').trim();
          if (!trimmed) return;
          const item = {
            id: Date.now() + Math.random().toString(36).slice(2, 7),
            text: trimmed,
            created: Date.now(),
          };
          tasks.open.unshift(item);
          save();
          input.value = '';
          input.focus();
        }

        function markDone(id) {
          const idx = tasks.open.findIndex((t) => t.id === id);
          if (idx === -1) return;
          const [t] = tasks.open.splice(idx, 1);
          tasks.done.unshift(t);
          save();
        }

        function reopen(id) {
          const idx = tasks.done.findIndex((t) => t.id === id);
          if (idx === -1) return;
          const [t] = tasks.done.splice(idx, 1);
          tasks.open.unshift(t);
          save();
        }

        function remove(id, fromDone) {
          const arr = fromDone ? tasks.done : tasks.open;
          const idx = arr.findIndex((t) => t.id === id);
          if (idx === -1) return;
          arr.splice(idx, 1);
          save();
        }

        clearDone.addEventListener('click', () => {
          if (tasks.done.length) {
            tasks.done = [];
            save();
          }
        });
        resetAll.addEventListener('click', () => {
          tasks = { open: [], done: [] };
          save();
        });
        addBtn.addEventListener('click', () => addTask(input.value));
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') addTask(input.value);
        });

        // expose for console during testing (optional)
        window.simpleTasks = { load, save, addTask, tasks };

        load();
        render();

        function update() {
          render();
        } // alias used by save/load
      })();
    </script>
  </body>
</html>
