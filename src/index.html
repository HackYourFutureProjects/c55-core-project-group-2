<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Todo App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <div class="hero-overlay">
        <h1 class="app-title">Todo App</h1>
      </div>
    </header>

    <main class="container">
      <nav class="filters" aria-label="task filters">
        <button class="filter active">Inbox</button>
        <button class="filter">Pending</button>
        <button class="filter">Completed</button>
      </nav>

      <section class="tasks-area">
        <div class="tasks-header">
          <h2>Tasks</h2>
          <button class="add-btn">+ Add</button>
        </div>

        <ul class="task-list">
          <li class="task">
            <div class="task-left">
              <input type="checkbox" aria-label="mark task done" />
              <div class="task-meta">
                <div class="task-title">Build Project Proposals</div>
                <div class="task-due">Due: Oct 31 2022</div>
              </div>
            </div>
            <div class="task-right">
              <button class="icon edit" title="edit">✎</button>
              <span class="priority high" title="high priority"></span>
            </div>
          </li>

          <li class="task">
            <div class="task-left">
              <input type="checkbox" />
              <div class="task-meta">
                <div class="task-title">Make Team Call</div>
                <div class="task-due">Due: Oct 28 2022</div>
              </div>
            </div>
            <div class="task-right">
              <button class="icon edit">✎</button>
              <span class="priority medium"></span>
            </div>
          </li>

          <li class="task">
            <div class="task-left">
              <input type="checkbox" />
              <div class="task-meta">
                <div class="task-title">Get Groceries</div>
                <div class="task-due">Due: Oct 26 2022</div>
              </div>
            </div>
            <div class="task-right">
              <button class="icon edit">✎</button>
              <span class="priority low"></span>
            </div>
          </li>

          <li class="task">
            <div class="task-left">
              <input type="checkbox" />
              <div class="task-meta">
                <div class="task-title">Send Email</div>
                <div class="task-due">Due: Oct 25 2022</div>
              </div>
            </div>
            <div class="task-right">
              <button class="icon edit">✎</button>
              <span class="priority medium"></span>
            </div>
          </li>
        </ul>

        <div class="completed">
          <strong>Completed</strong>
          <span class="caret">▾</span>
        </div>
      </section>
    </main>
  </body>
</html>
