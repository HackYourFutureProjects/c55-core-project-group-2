<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <script type="module" src="app.js" defer></script>
  </head>
  <body>
    <header class="hero">
      <div class="hero-overlay">
        <h1 class="app-title">Todo App</h1>
      </div>
    </header>

    <main class="container">
      <nav class="filters" aria-label="task filters">
        <button class="filter active">Inbox</button>
        <button class="filter">Unfinished</button>
        <button class="filter">Completed</button>
      </nav>

      <div class="input-bar">
        <input
          id="new-task-input"
          type="text"
          placeholder="What would you like to do today?"
        />
        <button id="new-task-btn" type="button">Enter ↵</button>
      </div>

      <section class="tasks-area">
        <div class="tasks-header">
          <h2>Tasks</h2>
        </div>
      </section>
    </main>
  </body>
</html>
