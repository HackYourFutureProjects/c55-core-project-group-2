<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="'image/x-icon" href="assets/favicon.ico" />
    <!-- JavaScript Files
    <script type="module" src="app.js" defer></script>
 -->
  </head>
  <body>
    <header class="hero">
      <div class="hero-overlay">
        <h1 class="app-title">Todo App</h1>
      </div>
    </header>

    <main class="container">
      <nav class="filters" aria-label="task filters">
        <button class="filter active">Inbox</button>
        <button class="filter">Unfinished</button>
        <button class="filter">Completed</button>
      </nav>

      <div class="input-bar">
        <input
          id="new-task-input"
          type="text"
          placeholder="What would you like to do today?"
        />
        <button id="new-task-btn" type="button">Enter ↵</button>
      </div>

      <section class="tasks-area">
        <div class="tasks-header">
          <h2>Tasks</h2>
        </div>

        <ul class="task-list">
          <li class="task">
            <div class="task-left">
              <input type="checkbox" aria-label="mark task done" />
              <div class="task-meta">
                <div class="task-title">Build Project Proposals</div>
                <div class="task-due">Due: Oct 31 2022</div>
              </div>
            </div>
            <div class="task-right">
              <button class="icon edit" title="edit">
                <i class="nf nf-fa-pen"></i>
              </button>
              <span class="priority high" title="high priority"></span>
            </div>
          </li>

          <li class="task">
            <div class="task-left">
              <input type="checkbox" />
              <div class="task-meta">
                <div class="task-title">Make Team Call</div>
                <div class="task-due">Due: Oct 28 2022</div>
              </div>
            </div>
            <div class="task-right">
              <button class="icon edit">
                <i class="nf nf-fa-pen"></i>
              </button>
              <span class="priority medium"></span>
            </div>
          </li>

          <li class="task">
            <div class="task-left">
              <input type="checkbox" />
              <div class="task-meta">
                <div class="task-title">Get Groceries</div>
                <div class="task-due">Due: Oct 26 2022</div>
              </div>
            </div>
            <div class="task-right">
              <button class="icon edit">
                <i class="nf nf-fa-pen"></i>
              </button>
              <span class="priority low"></span>
            </div>
          </li>

          <li class="task">
            <div class="task-left">
              <input type="checkbox" />
              <div class="task-meta">
                <div class="task-title">Send Email</div>
                <div class="task-due">Due: Oct 25 2022</div>
              </div>
            </div>
            <div class="task-right">
              <button class="icon edit">
                <i class="nf nf-fa-pen"></i>
              </button>
              <span class="priority medium"></span>
            </div>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
